name: Source and package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests -q
      - run: python scripts/smoke_mcp.py
      - run: python scripts/verify_harness_configs.py
      - run: python -m build --outdir local-data/dist/packages
      - run: python scripts/verify_distribution.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: verified-python-packages
          path: |
            local-data/dist/packages/*.whl
            local-data/dist/packages/*.tar.gz
          if-no-files-found: error

  fresh-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_fresh_install.py --with-geometry
